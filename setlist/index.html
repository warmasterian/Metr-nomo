<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-name" content="Setlist Click">
<meta name="description" content="Click con mapa de cada tema: avisa los cambios de sección (estribillo, puente, cortes) para Meta Ray-Ban Display.">
<title>Setlist Click</title>
<style>
  /* Fondo negro puro = transparente en la pantalla aditiva de las gafas. */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { inline-size: 100%; block-size: 100%; }
  body { margin: 0; background: #000; color: #fff; overflow: hidden;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  :root { --c: #5ee1ff; }

  .scr { position: fixed; inset: 0; padding: 3.6vmin; display: flex; flex-direction: column; gap: 1.8vmin; min-block-size: 0; }
  .scroll { overflow-y: auto; scroll-padding-block: 22vmin; }

  button, textarea { font: inherit; color: #fff; }
  button { font-weight: 600; font-size: 21px; cursor: pointer; min-block-size: 56px; padding: 6px 14px;
           border-radius: 20px; background: #1b1d23; border: 2px solid #5b5f6b; }
  button:active { background: #2e3140; }
  button:focus-visible, textarea:focus-visible { outline: 4px solid #fff; outline-offset: 3px; background: #2a2d37; }
  button[aria-pressed="true"] { background: #2a4a57; border-color: var(--c); }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header.top h1 { margin: 0; font-size: 28px; }
  header.top .acts { display: flex; gap: 8px; }
  header.top button { min-block-size: 50px; font-size: 19px; }

  /* ---------- Lista de temas ---------- */
  #list { display: grid; gap: 10px; padding-block-end: 14px; }
  .song { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; text-align: start; padding: 10px 16px; min-block-size: 72px; }
  .song .n { grid-row: 1 / 3; font-size: 30px; color: var(--c); min-inline-size: 34px; text-align: center; }
  .song .t { font-size: 25px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .m { font-size: 17px; color: #a8adbb; font-weight: 500; }
  .foot { font-size: 16px; color: #8a8f9c; margin: 2px 6px 0; }

  /* ---------- Pantalla del tema ---------- */
  #sTop { display: flex; justify-content: space-between; gap: 12px; font-size: 19px; color: #a8adbb; }
  #sName { color: #e6e8ee; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sMeta { white-space: nowrap; }
  #sNow { flex: 1 1 0; min-block-size: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.6vmin; }
  #secName { font-weight: 800; line-height: 1; letter-spacing: -.01em; color: var(--c); white-space: nowrap; transform-origin: center; }
  #secSub { font-size: 24px; color: #cfd3de; }
  #pips { display: flex; gap: 10px; min-block-size: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #pips span { inline-size: 20px; block-size: 20px; border-radius: 50%; background: #fff; opacity: .25; }
  #pips span.first { background: #ffc84a; }
  #pips span.on { opacity: 1; transform: scale(1.35); }

  #nextBox { border: 2px solid #3a3d48; border-radius: 20px; padding: 10px 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
             min-block-size: 64px; align-content: center; }
  #nextLbl { font-size: 18px; color: #a8adbb; text-transform: uppercase; letter-spacing: .08em; }
  #nextName { font-size: 30px; color: var(--nc, #fff); }
  #nextIn { font-size: 20px; color: #cfd3de; margin-inline-start: auto; }
  #nextBox.warn { border: 4px solid var(--nc, #fff); box-shadow: 0 0 calc(var(--p, 0) * 30px) var(--nc, #fff); }
  #nextBox.warn #nextName { font-size: 38px; font-weight: 800; }

  #outline { font-size: 17px; color: #a8adbb; line-height: 1.35; max-block-size: 4.2em; overflow: hidden; }
  /* Pista que avanza: las secciones vienen desde la derecha hacia la línea de "ahora" */
  #lane { position: relative; flex: none; block-size: 56px; border-radius: 14px; border: 1px solid #3a3d48; overflow: hidden; background: #08090b; }
  .rb { position: absolute; inset-block: 4px; inset-inline-start: 0; border-radius: 9px; background-color: var(--sc); color: #000; font-weight: 800; font-size: 18px;
        display: flex; align-items: center; padding-inline: 8px; white-space: nowrap; overflow: hidden; will-change: transform;
        background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.55) 0 2px, transparent 2px calc(100% / var(--b))); }
  #now { position: absolute; inset-block: 0; inline-size: 4px; background: #fff; box-shadow: 0 0 10px #fff; border-radius: 2px; z-index: 2; }
  /* Mapa de todo el tema con indicador de avance */
  #mapWrap { position: relative; flex: none; }
  #map { display: flex; block-size: 30px; border-radius: 9px; overflow: hidden; border: 1px solid #3a3d48; }
  .seg { position: relative; min-inline-size: 3px; background: #0d0e11; box-shadow: inset -2px 0 #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .seg.cur { box-shadow: inset -2px 0 #000, inset 0 0 0 2px #fff; }
  .seg i { position: absolute; inset: 0 auto 0 0; inline-size: 0; background: var(--sc); opacity: .85; }
  .seg b { position: relative; z-index: 1; font-size: 13px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; }
  #head { position: absolute; inset-block: -4px; inline-size: 4px; margin-inline-start: -2px; background: #fff; box-shadow: 0 0 8px #fff; border-radius: 2px; }
  #tRow { display: flex; justify-content: space-between; flex: none; font-size: 19px; color: #cfd3de; font-variant-numeric: tabular-nums; }
  #sbar { display: flex; gap: 2.2vmin; transition: opacity .35s; }
  #sbar.dim { opacity: 0; }
  #sbar button { flex: 1 1 0; }
  #sbar #playBtn { flex: 1.6 1 0; }
  #flash { position: fixed; inset: 0; border: 12px solid var(--fc, #fff); border-radius: 26px; opacity: 0; pointer-events: none; }

  /* ---------- Ajustes y editor ---------- */
  #cfgList { display: grid; gap: 10px; padding-block-end: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 22px; background: #15161a; border: 1px solid #343741; }
  .lbl { font-size: 21px; color: #e6e8ee; }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .val { min-inline-size: 130px; text-align: center; font-size: 21px; font-weight: 700; color: var(--c); }
  .sq { min-inline-size: 56px; padding-inline: 0; font-size: 26px; }
  .note { margin: 4px 6px 0; font-size: 17px; color: #8a8f9c; }
  #ta { flex: 1 1 0; min-block-size: 0; background: #0d0e11; border: 2px solid #5b5f6b; border-radius: 18px; padding: 12px; font-size: 19px; line-height: 1.35; resize: none; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #eMsg { font-size: 17px; color: #ffc84a; max-block-size: 4.4em; overflow-y: auto; }
  .edBtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .edBtns button { flex: 1 1 22%; font-size: 18px; }
</style>
</head>
<body>

<section class="scr" id="scrList">
  <header class="top">
    <h1>Setlist</h1>
    <div class="acts"><button type="button" id="cfgBtn">Ajustes</button><button type="button" id="editBtn">Editar</button></div>
  </header>
  <div class="scroll" style="flex:1 1 0">
    <div id="list"></div>
    <p class="foot" id="srcLbl"></p>
  </div>
</section>

<section class="scr" id="scrSong" hidden>
  <div id="sTop"><span id="sName"></span><span id="sMeta"></span></div>
  <div id="sNow" aria-live="off">
    <div id="secName"></div>
    <div id="secSub"></div>
    <div id="pips"></div>
  </div>
  <div id="nextBox"><span id="nextLbl"></span><span id="nextName"></span><span id="nextIn"></span></div>
  <div id="outline"></div>
  <div id="lane" aria-hidden="true"><div id="now"></div></div>
  <div id="mapWrap" aria-hidden="true"><div id="map"></div><div id="head"></div></div>
  <div id="tRow"><span id="tEl">0:00</span><span id="tBar"></span><span id="tLeft"></span></div>
  <nav id="sbar" aria-label="Controles">
    <button type="button" id="listBtn">Lista</button>
    <button type="button" id="prevBtn" aria-label="Sección anterior">◀</button>
    <button type="button" id="playBtn">Iniciar</button>
    <button type="button" id="nextBtn" aria-label="Sección siguiente">▶</button>
  </nav>
</section>

<section class="scr" id="scrSet" hidden>
  <header class="top"><h1>Ajustes</h1><div class="acts"><button type="button" id="setDone">Listo</button></div></header>
  <div class="scroll" style="flex:1 1 0"><div id="cfgList"></div></div>
</section>

<section class="scr" id="scrEdit" hidden>
  <header class="top"><h1>Editar temas</h1><div class="acts"><button type="button" id="editBack">Volver</button></div></header>
  <textarea id="ta" spellcheck="false" aria-label="Texto de los temas"></textarea>
  <div id="eMsg"></div>
  <div class="edBtns">
    <button type="button" id="saveBtn">Guardar</button>
    <button type="button" id="fileBtn">Leer archivo</button>
    <button type="button" id="demoBtn">Ejemplo</button>
  </div>
</section>

<div id="flash"></div>

<script>
(() => {
'use strict';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = (s) => document.querySelector(s);
const setT = (el, t) => { if (el._t !== t) { el.textContent = t; el._t = t; } };

/* ================= Formato de texto =================
   # Nombre del tema | 120 | 4/4
   Intro 4
   Verso 16
   Puente 8 @140        (cambia el tempo desde esa sección)
   Corte 2
   Líneas que empiezan con // son comentarios.                         */
const DEMO = `// Ejemplo. Cada tema empieza con #  (nombre | bpm | compás)
// Cada línea: nombre de la sección y cantidad de compases

# Tema de ejemplo | 120 | 4/4
Intro 4
Verso 16
Estribillo 8
Verso 16
Estribillo 8
Puente 8
Corte 2
Estribillo 16
Final 4

# Balada lenta | 72 | 4/4
Intro 2
Verso 8
Estribillo 8
Solo 8
Estribillo 8
Final 2

# Cambio de tempo | 100 | 4/4
Intro 4
Verso 8
Puente 4 @140
Estribillo 8 @100
Final 4
`;

const KINDS = {
  intro: '#6dff9a', verso: '#5ee1ff', pre: '#b8a8ff', coro: '#ffc84a', puente: '#ff7ab8',
  solo: '#ff9a4a', corte: '#ffffff', final: '#6dff9a', otro: '#dfe3ee',
};
function kindOf(name) {
  const n = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (/^(corte|silencio|stop|break|parada|pausa)/.test(n)) return 'corte';
  if (/^(intro|entrada)/.test(n)) return 'intro';
  if (/^pre/.test(n)) return 'pre';
  if (/^(estribillo|coro|chorus|ritornelo)/.test(n)) return 'coro';
  if (/^(verso|estrofa|verse)/.test(n)) return 'verso';
  if (/^(puente|bridge|medio)/.test(n)) return 'puente';
  if (/^(solo|instrumental|interludio)/.test(n)) return 'solo';
  if (/^(final|outro|coda|fin\b)/.test(n)) return 'final';
  return 'otro';
}

function parse(text) {
  const songs = [], errors = [];
  let cur = null;
  const mk = (name) => { cur = { name, bpm: 100, beats: 4, meter: '4/4', secs: [] }; songs.push(cur); };
  String(text).replace(/\r/g, '').split('\n').forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line.startsWith('//')) return;
    if (line[0] === '#') {
      const parts = line.replace(/^#+\s*/, '').split('|').map((s) => s.trim());
      mk(parts[0] || 'Sin título');
      for (const p of parts.slice(1)) {
        let m;
        if ((m = p.match(/^(\d{1,2})\s*\/\s*(\d{1,2})$/))) { cur.beats = clamp(+m[1], 1, 16); cur.meter = `${m[1]}/${m[2]}`; }
        else if ((m = p.match(/^(\d{2,3})(?:\s*bpm)?$/i))) cur.bpm = clamp(+m[1], 30, 300);
        else if (p) errors.push(`Línea ${i + 1}: no entendí “${p}”`);
      }
      return;
    }
    if (!cur) mk('Sin título');
    const m = line.match(/^(.*?)\s+x?(\d{1,3})\s*(?:@\s*(\d{2,3}))?$/i);
    if (!m || !m[1].trim()) { errors.push(`Línea ${i + 1}: “${line}” (falta la cantidad de compases)`); return; }
    cur.secs.push({ name: m[1].trim(), bars: clamp(+m[2], 1, 999), bpm: m[3] ? clamp(+m[3], 30, 300) : 0 });
  });
  const ok = [];
  for (const s of songs) {
    if (!s.secs.length) { errors.push(`“${s.name}” no tiene secciones`); continue; }
    let b = s.bpm, acc = 0, secs = 0;
    for (const sec of s.secs) {
      if (sec.bpm) b = sec.bpm;
      sec.bpm = b; sec.kind = kindOf(sec.name); sec.startBar = acc; sec.startTime = secs; acc += sec.bars;
      secs += sec.bars * s.beats * 60 / b;
    }
    s.totalBars = acc; s.dur = secs;
    ok.push(s);
  }
  return { songs: ok, errors };
}
window.SetlistClick = { parse };
const fmtDur = (s) => { const t = Math.round(Math.max(0, s)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };

/* ================= Ajustes ================= */
const KEYC = 'mrbd-setlist-cfg-v1', KEYT = 'mrbd-setlist-text-v1';
const DEFC = { warn: 1, cin: 1, muteCuts: true, autoNext: false, voice: false, vol: 70, sync: 0, autoHide: true };
let S = { ...DEFC };
try { const r = localStorage.getItem(KEYC); if (r) S = { ...DEFC, ...JSON.parse(r) }; } catch (e) {}
function sanitize() {
  S.warn = clamp(Math.round(+S.warn) || 0, 0, 2); S.cin = clamp(Math.round(+S.cin) || 0, 0, 2);
  S.vol = clamp(Math.round(+S.vol) || 0, 0, 100); S.sync = clamp(Math.round(+S.sync) || 0, -300, 300);
  S.muteCuts = !!S.muteCuts; S.autoNext = !!S.autoNext; S.voice = !!S.voice; S.autoHide = !!S.autoHide;
}
sanitize();
const saveCfg = () => { try { localStorage.setItem(KEYC, JSON.stringify(S)); } catch (e) {} };

/* ================= Audio ================= */
let ac = null, master = null;
function ensureAudio() {
  if (ac) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC({ latencyHint: 'interactive' });
    master = ac.createGain(); master.gain.value = S.vol / 100; master.connect(ac.destination);
  } catch (e) { ac = null; }
}
const clockNow = () => (ac ? ac.currentTime : performance.now() / 1000);
function blip(type, f, time, dur, peak, fEnd) {
  const g = ac.createGain(), o = ac.createOscillator();
  o.type = type; o.frequency.setValueAtTime(f, time);
  if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, time + dur);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(peak, time + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g); g.connect(master); o.start(time); o.stop(time + dur + 0.02);
}
/* Guías auditivas:
   - click normal: cuadrada (acento en el 1)
   - aviso: triángulo agudo que SUBE de tono golpe a golpe, hasta caer en el cambio
   - entrada a la sección: golpe grave propio de cada tipo (frecuencia y cantidad de golpes distintas) */
const ENTRY = { intro: [220, 1], verso: [196, 1], pre: [247, 1], coro: [294, 2], puente: [330, 2], solo: [262, 1], corte: [147, 1], final: [165, 3], otro: [220, 1] };
function tick(time, beat, warn, start, muted, kind, beats) {
  if (!ac) return;
  if (start) {                              // suena aunque el corte esté silenciado: marca dónde empieza
    const [f, n] = ENTRY[kind] || ENTRY.otro;
    for (let i = 0; i < n; i++) blip('sine', f * (1 + i * 0.25), time + i * 0.075, 0.16, 1, f * 0.5);
    if (!muted) blip('square', 2200, time, 0.035, 1);
    return;
  }
  if (muted) return;
  if (warn) blip('triangle', 2000 + (beat / Math.max(1, beats - 1)) * 1800, time, 0.06, 0.95);
  else blip('square', beat === 0 ? 2200 : 1500, time, 0.035, beat === 0 ? 1 : 0.72);
}

/* ================= Datos ================= */
let songs = [], songIdx = 0, startSec = 0, finished = false, srcLabel = '';
function setSongs(text, label) {
  let r = parse(text);
  if (!r.songs.length) { r = parse(DEMO); label = 'ejemplo (el texto no tenía temas válidos)'; }
  songs = r.songs; srcLabel = label; songIdx = clamp(songIdx, 0, songs.length - 1);
  return r;
}
async function loadInitial() {
  let text = null, label = '';
  try { text = localStorage.getItem(KEYT); if (text) label = 'texto editado en las gafas'; } catch (e) {}
  if (!text) {
    try { const r = await fetch('canciones.txt?' + Date.now(), { cache: 'no-store' }); if (r.ok) { text = await r.text(); label = 'canciones.txt'; } } catch (e) {}
  }
  if (!text) { text = DEMO; label = 'ejemplo'; }
  setSongs(text, label);
  renderList();
}

/* ================= Pantallas e historial ================= */
const screens = { list: $('#scrList'), song: $('#scrSong'), set: $('#scrSet'), edit: $('#scrEdit') };
let screen = 'list';
function show(name) {
  if (screen === 'song' && name !== 'song') stopPlayback();
  screen = name;
  for (const k in screens) screens[k].hidden = k !== name;
  $('#flash').style.opacity = 0;
  const focusEl = { list: () => $('#list .song') || $('#editBtn'), song: () => $('#playBtn'), set: () => $('#setDone'), edit: () => $('#editBack') }[name]();
  setTimeout(() => focusEl && focusEl.focus({ preventScroll: true }), 0);
  if (name === 'song') { wake(); armHide(); }
}
function go(name) { try { history.pushState({ s: name }, ''); } catch (e) {} show(name); }
function back() { if (history.state && history.state.s && history.state.s !== 'list') history.back(); else show('list'); }
try { history.replaceState({ s: 'list' }, ''); } catch (e) {}
window.addEventListener('popstate', (e) => show((e.state && e.state.s) || 'list'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && screen !== 'list') back(); });

/* ================= Lista ================= */
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  kids.flat().forEach((c) => el.append(c));
  return el;
}
function renderList() {
  const list = $('#list'); list.innerHTML = '';
  songs.forEach((s, i) => {
    list.append(h('button', { type: 'button', class: 'song', onclick: () => { loadSong(i); go('song'); } },
      h('span', { class: 'n' }, String(i + 1)), h('span', { class: 't' }, s.name),
      h('span', { class: 'm' }, `${s.bpm} BPM · ${s.meter} · ${s.secs.length} secciones · ${fmtDur(s.dur)}`)));
  });
  $('#srcLbl').textContent = `Origen: ${srcLabel}.`;
  if (screen === 'list') { const f = $('#list .song'); if (f) f.focus({ preventScroll: true }); }
}

/* ================= Reproducción ================= */
let playing = false, timer = null, nextTime = 0, ended = false, endTime = 0, evN = 0, lastSpoken = -1;
const P = { song: 0, sec: 0, bar: 0, beat: 0, after: 0 };
const events = [];

function schedule() {
  const horizon = clockNow() + 0.12;
  while (!ended && nextTime < horizon) {
    const song = songs[P.song], cin = P.sec < 0;
    const sec = cin ? null : song.secs[P.sec];
    const bpm = cin ? song.secs[P.after].bpm : sec.bpm;
    const total = cin ? S.cin : sec.bars;
    const barsLeft = total - P.bar;
    const warn = !cin && S.warn > 0 && barsLeft <= S.warn;
    const start = !cin && P.bar === 0 && P.beat === 0;
    const muted = !cin && sec.kind === 'corte' && S.muteCuts && !(warn && sec.bars > 1);
    const nextSec = cin ? song.secs[P.after] : (song.secs[P.sec + 1] || null);
    events.push({ n: evN++, time: nextTime, song: P.song, sec: P.sec, bar: P.bar, beat: P.beat, bpm, total, barsLeft, warn, start,
                  nextSec, speak: warn && barsLeft === S.warn && P.beat === 0 });
    tick(nextTime, P.beat, warn, start, muted, sec ? sec.kind : 'otro', song.beats);
    nextTime += 60 / bpm;
    if (++P.beat >= song.beats) {
      P.beat = 0;
      if (++P.bar >= total) {
        P.bar = 0;
        if (cin) P.sec = P.after;
        else if (++P.sec >= song.secs.length) {
          if (S.autoNext && P.song + 1 < songs.length) { P.song++; P.after = 0; P.sec = S.cin > 0 ? -1 : 0; }
          else { ended = true; endTime = nextTime; }
        }
      }
    }
  }
  while (events.length > 60) events.shift();
}

let wl = null;
async function lockScreen() { try
